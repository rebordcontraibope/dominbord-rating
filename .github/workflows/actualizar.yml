name: Actualizar rating

on:
  schedule:
    # Hora Argentina = UTC-3. El script es idempotente: si no hay nada nuevo no escribe ni commitea.
    - cron: "30 1 * * 1"   # DOMINGO 22:30 (01:30 UTC del lunes): lee la grilla de TeleRed y anota quién compite en la franja
    - cron: "30 3 * * 1"   # lunes 00:30  primera pasada, por si algo salió a la noche
    - cron: "0 10 * * 1"   # lunes 07:00  television.com.ar suele publicar a la mañana
    - cron: "0 12 * * 1"   # lunes 09:00  por si la planilla salió tarde
    - cron: "0 15 * * 1"   # lunes 12:00  completa rivales que falten
    - cron: "0 19 * * 1"   # lunes 16:00  ya suele estar el blog de Ponele Show (~16:00)
    - cron: "0 14 * * 2"   # martes 11:00 red de seguridad para lo que quedó provisorio
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha de la emisión (YYYY-MM-DD). Vacío = último domingo"
        required: false
      x_post:
        description: "Link a un post de X con los ratings (opcional)"
        required: false
      youtube:
        description: "Link al programa en YouTube (opcional)"
        required: false
      grilla:
        description: "Solo anotar quién compite en la franja (grilla de HOY)"
        type: boolean
        default: false
      solo_probar:
        description: "Solo mostrar qué haría, sin escribir ni commitear"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Correr scraper (todas las fuentes de FUENTES)
        env:
          FECHA: ${{ github.event.inputs.fecha }}
          X_POST: ${{ github.event.inputs.x_post }}
          YOUTUBE: ${{ github.event.inputs.youtube }}
          SOLO_PROBAR: ${{ github.event.inputs.solo_probar }}
          GRILLA: ${{ github.event.inputs.grilla }}
        run: |
          ARGS=""
          [ -n "$FECHA" ]   && ARGS="$ARGS --fecha $FECHA"
          [ -n "$X_POST" ]  && ARGS="$ARGS --x-post $X_POST"
          [ -n "$YOUTUBE" ] && ARGS="$ARGS --youtube $YOUTUBE"
          [ "$SOLO_PROBAR" = "true" ] && ARGS="$ARGS --dry-run"
          [ "$GRILLA" = "true" ] && ARGS="$ARGS --grilla"
          # el cron "30 1 * * 1" (domingo 22:30 ARG) es el de la grilla; los demás, ratings.
          # Se decide por el cron que disparó y no por la hora: GitHub puede atrasar un schedule varias horas.
          if [ "${{ github.event.schedule }}" = "30 1 * * 1" ]; then
            python3 scripts/actualizar_rating.py --grilla $ARGS
          else
            python3 scripts/actualizar_rating.py $ARGS
          fi

      - name: Generar placa del último round y apuntar og:image
        # corre aunque el scraper haya fallado: es idempotente y así se prueba con solo_probar
        if: ${{ always() }}
        run: |
          which convert >/dev/null || sudo apt-get install -y -q imagemagick
          python3 scripts/generar_placa.py ${{ github.event.inputs.solo_probar == 'true' && '--dry-run' || '' }}

      - name: Commitear si cambió
        if: ${{ github.event.inputs.solo_probar != 'true' }}
        run: |
          git config user.name "rating-bot"
          git config user.email "rating-bot@users.noreply.github.com"
          git add data/emisiones.js index.html assets/placas
          git diff --cached --quiet && echo "Sin cambios" || (git commit -m "rating: actualización automática" && git push)
